<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - App de Productividad</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #FFD1DC;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #F5B7B1;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        p {
            color: #4A4A4A;
            font-size: 1.1em;
            line-height: 1.6;
        }
        .btn {
            background: #F5B7B1;
            border: none;
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2em;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
            animation: pulse 2s ease-in-out infinite;
        }
        .btn:hover {
            background: #e8a098;
            transform: scale(1.1);
            animation-play-state: paused;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        .emoji {
            font-size: 4em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🌸</div>
        <h1>Bloom</h1>
        <p>Tu compañera de bienestar digital 💗<br>
        Descubre cómo usas tu tiempo ⏰ y <br>
        cultiva hábitos más conscientes 🌱.</p>
        <button class="btn">Comenzar ✨</button>
    </div>
</body>
</html>
